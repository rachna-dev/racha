# cargo-deny: licence and advisory policy.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Rachna is MIT OR Apache-2.0; a copyleft dependency
# would change what we can ship.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

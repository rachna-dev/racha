# cargo-deny: licence and advisory policy.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Rachna is MIT OR Apache-2.0; a copyleft dependency
# would change what we can ship.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # `foldhash`, via hashbrown -> hashlink -> rusqlite. OSI-approved, FSF
  # Free/Libre, permissive, and notably does NOT require attribution in
  # binaries — so it changes nothing about what Rachna can ship. Added when
  # the store landed rather than pre-emptively, so every entry here traces to
  # a dependency we actually took.
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

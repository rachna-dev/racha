# Forgejo Actions. Same checks as GitHub — they live in ci/gate.sh, which both
# workflows call — but the toolchain comes from rustup in containers rather
# than from Nix.
#
# Why the difference: Forgejo runners cannot reliably use the cachix actions
# that install and cache Nix, and installing Nix per job without a binary cache
# is slow enough to be impractical. The GitHub `devenv` job covers the shell
# itself, so between the two providers both paths are checked.
#
# Platform coverage differs too, and the reason is structural rather than a
# choice: Forgejo runners are typically self-hosted Linux, with no macOS
# available. So this provider covers the Linux variants and GitHub covers
# macOS. Tests that encode macOS-specific behaviour — APFS case-insensitivity
# especially (design-docs/12 §3) — are therefore gated by GitHub, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate · ${{ matrix.name }}
    runs-on: docker
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian (stable)
            image: rust:1-bookworm
          - name: ubuntu (24.04)
            image: ubuntu:24.04
          # Rolling release: catches breakage from a newer glibc, kernel or
          # toolchain before the LTS distros do.
          - name: arch (rolling)
            image: archlinux:latest
    steps:
      - name: prerequisites
        run: |
          set -eux
          if command -v pacman >/dev/null; then
            pacman -Sy --noconfirm --needed base-devel git rustup nodejs
            rustup default stable
          elif command -v apt-get >/dev/null && ! command -v cargo >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential curl git ca-certificates
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@v4
      - name: install components and nextest
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt clippy
          cargo install cargo-nextest --locked
      - name: gate
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ci/gate.sh gate

  mutants:
    name: mutation testing (a surviving mutant fails the build)
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-nextest cargo-mutants --locked
      - run: ci/gate.sh mutants
      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mutants-report
          path: mutants.out/

  deps:
    name: dependency audit
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-machete cargo-deny --locked
      - run: ci/gate.sh deps

  coverage:
    name: coverage (reported, not gated)
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-nextest cargo-llvm-cov --locked
      - run: cargo llvm-cov nextest --summary-only

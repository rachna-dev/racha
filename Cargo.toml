# Rachna — ONE crate. Modules, not crates, until something forces a split.
# See AGENTS.md "One crate until forced" and design-docs/01-ARCHITECTURE.md §1
# for why the previous twelve-crate workspace was deleted.

[package]
name = "rachna"
description = "A declarative, isolated development environment you can pause, resume, and throw away."
# Major.Minor.Patch+<NixOS release> — the guest system version is carried in
# the rachna version, so the pairing is visible wherever a version appears
# (design-docs/08-POLICY-AND-STORE.md §4.1.1).
#
# `+` not `-`: SemVer reads a hyphen as a PRE-RELEASE, which would sort before
# 0.4.0 and make `cargo add` skip it. `+` is build metadata — ignored for
# precedence, and exactly the field for "what this was built against".
# Tested: Cargo rejects `0.4-26.11` outright.
#
# Patch is kept and SHOWN, not elided to a shorter `Major.Minor+guest`: a patch
# bump is the promise "bug fix only, same guest, snapshots still restore", which
# is the signal users of a security tool most need to read off the version
# itself. A guest bump invalidates snapshots and is therefore never a patch.
#
# Still 0.0.0 while there is no guest to pin to; becomes e.g. 0.1.0+26.11 at
# the first release that ships one.
version = "0.0.0"
edition = "2021"
# Raised from 1.82 on evidence, not preference. 1.82 silently capped `time` at
# 0.3.44 — inside the range of RUSTSEC-2026-0009, a stack-exhaustion DoS whose
# fix requires 1.88 — and held back rusqlite, rnix, clap, notify and proptest.
# Edition-2024 crates need >=1.85 regardless of their declared MSRV, because
# the resolver does not filter on edition: you get a version that resolves and
# then fails to compile. 1.82 was buying nothing and costing a live advisory.
# See design-docs/17-DEPENDENCIES.md.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shriyans/rachna"
publish = false

[dependencies]
codespan-reporting = "0.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# DELIBERATELY EMPTY until step 2 needs something and the alternatives have
# been compared (AGENTS.md, "Evaluate alternatives before adding a
# dependency"). An earlier version of this file listed camino, serde,
# thiserror, time and uuid — 23 transitive crates — chosen before that rule
# existed and before any code used them. `time` and `uuid` were referenced
# nowhere at all.
#
# The comparison lives in design-docs/17-DEPENDENCIES.md; each dependency is
# added in the commit that first uses it.

# macOS only: Virtualization.framework is an Objective-C API, and a Linux
# build must not pull an Apple binding it can never use. The whole lifecycle
# surface is SAFE Rust, which is why this is a crate rather than a shim —
# `Cargo.toml` denies unsafe_code, and a binding needing unsafe per call
# would mean weakening that in the most security-sensitive module
# (design-docs/17-DEPENDENCIES.md, "macOS VZ binding").
# Signalling a process we did not spawn. `std` cannot: `Child::kill` needs
# the `Child`, and `stop` runs in a *different process* from `start` — so the
# PID comes from a file, not a handle. Measured the alternatives:
#
#   `libc::kill`      rejected — needs `unsafe`, and this file DENIES it. The
#                     VZ binding was chosen specifically to avoid weakening
#                     that in a security-sensitive module (see below), so
#                     weakening it here for a signal would be worse.
#   spawn `/bin/kill` works (verified: exit 0 vs 256 distinguishes the
#                     cases) and rejected anyway — a subprocess per signal,
#                     in the path that must reliably tear a VM down.
#   `rustix`          CHOSEN — safe `kill_process`/`test_kill_process`,
#                     compiles under `unsafe_code = "deny"` (verified), and
#                     adds `bitflags`/`errno`/`libc`, all three already in
#                     the tree via rusqlite.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "termios"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-virtualization = "0.3.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
# Also pending the comparison — property testing lands with the path
# translation and policy work that needs it.

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
# This is a security boundary: no silent panics in policy or path code.
#
# NOTE these also fire in test code, where AGENTS.md says unwrap/expect are
# fine and clearer than ceremony. src/lib.rs therefore carries a
# cfg_attr(test, allow(..)) at the crate root. Verified rather than assumed:
# without it, a single unwrap() in a test fails the gate.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# The "I'll just convert this integer" class of bug.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
# A shim binary is spawned per editor tool invocation, so startup cost matters
# more than peak throughput (design-docs/00-PRODUCT.md §6.6).
lto = "thin"
codegen-units = 1
strip = true

# cargo-mutants: the real testing bar for this project (AGENTS.md).
[package.metadata.mutants]
# Timeout multiplier — a mutant that hangs should fail fast rather than stall
# the run.
timeout_multiplier = 3.0

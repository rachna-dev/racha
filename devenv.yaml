# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # Required by the `git-hooks.hooks` block in devenv.nix.
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs

  # Rust toolchain channels, so `languages.rust.channel` can select "stable"
  # with components (clippy, rustfmt, rust-analyzer, rust-src).
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs

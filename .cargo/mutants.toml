# cargo-mutants configuration.

# Mutation testing runs the suite once per mutant, so a slow test is paid
# ~160 times over. The eval-sandbox tests spawn real `nix eval` and take ~100s
# together, which made the unmutated baseline alone 95s and pushed the
# auto-chosen per-mutant timeout to 476s.
#
# They are excluded here rather than from the gate: they prove the RESTRICTION
# blocks real attacks, which is a property of the nix invocation, not of the
# Rust logic a mutant changes. Nothing a mutant does to `src/` can make
# `--restrict-eval` stop working. `ci/gate.sh sandbox` and a dedicated CI job
# run them for real.
test_tool = "nextest"
additional_cargo_test_args = ["-E", "not binary(eval_sandbox)"]

# One excluded mutation, with its reasoning.
#
# `days_between`'s clamp compares `days > u32::MAX as i64`. Mutating `>` to
# `>=` produces an EQUIVALENT program: at exactly `u32::MAX` the clamp returns
# `u32::MAX` and so does the cast, so no test can distinguish them. Verified by
# enumerating both branches, and by rewriting the function two other ways
# (`Ord::min`, capping the span in millis) — `min` is not const-stable, and the
# span form is identical on every input including the boundary. The ambiguity
# is inherent to a saturating clamp rather than a property of this spelling.
#
# The boundary also needs a timestamp ~11.8 million years out to reach.
#
# Excluded by NAME, not by file: everything else in audit.rs must stay under
# mutation. Contrast the `guest_release` survivor earlier in this project,
# which was documented as benign and then DELETED on review — that one was
# untested dead code, this one is tested code with a provably equivalent
# mutant. The distinction is whether a test could exist, not whether one does.

# The non-macOS stubs cannot be killed from a macOS host.
#
# `cargo-mutants` mutates source that `cfg` excludes from the host build, so
# `binary_has_entitlement`'s `cfg(not(target_os = "macos"))` arm is reported
# as surviving on a Mac — no macOS test can reach code that is not compiled.
# Its Linux counterpart IS tested (`off_macos_nothing_is_ever_entitled`), and
# the Linux CI job kills it there. The platform matrix (01 §4.2) exists for
# exactly this kind of per-platform behaviour.
#
# Excluded by NAME rather than by file, so every other function in the macOS
# backend stays under mutation.

# Both exclusions, merged — TOML permits one key per table.
exclude_re = ["replace > with >= in days_between", "replace binary_has_entitlement -> bool with true"]

# cargo-mutants configuration.

# Mutation testing runs the suite once per mutant, so a slow test is paid
# ~160 times over. The eval-sandbox tests spawn real `nix eval` and take ~100s
# together, which made the unmutated baseline alone 95s and pushed the
# auto-chosen per-mutant timeout to 476s.
#
# They are excluded here rather than from the gate: they prove the RESTRICTION
# blocks real attacks, which is a property of the nix invocation, not of the
# Rust logic a mutant changes. Nothing a mutant does to `src/` can make
# `--restrict-eval` stop working. `ci/gate.sh sandbox` and a dedicated CI job
# run them for real.
test_tool = "nextest"
additional_cargo_test_args = ["-E", "not binary(eval_sandbox)"]

# One excluded mutation, with its reasoning.
#
# `days_between`'s clamp compares `days > u32::MAX as i64`. Mutating `>` to
# `>=` produces an EQUIVALENT program: at exactly `u32::MAX` the clamp returns
# `u32::MAX` and so does the cast, so no test can distinguish them. Verified by
# enumerating both branches, and by rewriting the function two other ways
# (`Ord::min`, capping the span in millis) — `min` is not const-stable, and the
# span form is identical on every input including the boundary. The ambiguity
# is inherent to a saturating clamp rather than a property of this spelling.
#
# The boundary also needs a timestamp ~11.8 million years out to reach.
#
# Excluded by NAME, not by file: everything else in audit.rs must stay under
# mutation. Contrast the `guest_release` survivor earlier in this project,
# which was documented as benign and then DELETED on review — that one was
# untested dead code, this one is tested code with a provably equivalent
# mutant. The distinction is whether a test could exist, not whether one does.

# The non-macOS stubs cannot be killed from a macOS host.
#
# `cargo-mutants` mutates source that `cfg` excludes from the host build, so
# `binary_has_entitlement`'s `cfg(not(target_os = "macos"))` arm is reported
# as surviving on a Mac — no macOS test can reach code that is not compiled.
# Its Linux counterpart IS tested (`off_macos_nothing_is_ever_entitled`), and
# the Linux CI job kills it there. The platform matrix (01 §4.2) exists for
# exactly this kind of per-platform behaviour.
#
# Excluded by NAME rather than by file, so every other function in the macOS
# backend stays under mutation.

# `main.rs`'s COMMAND functions, and only those.
#
# SIX functions, each of which boots or tears down a real VM, spawns a
# supervisor, and returns an `ExitCode`. A unit test cannot reach their
# internal conditions without a hypervisor; the binary tests exercise them
# end to end, which proves the behaviour and cannot discriminate a flipped
# `&&`.
#
# The list is six because every candidate was TESTED before being excluded,
# and nine turned out not to need it. `context`, `snapshots`, `init`,
# `report`, `resolve_name`, `backend_capabilities`, `detect_tap`,
# `read_answer` and `read_answer_line` are all killed by tests that already
# existed — so excluding `main.rs` wholesale, which is what was first asked
# for, would have silenced 13 killed mutants and nine working ones.
#
# **Excluded by NAME, like the two above, not by file.** `main.rs` also holds
# `project_slug`, `path_hash` and `now_millis` — pure functions whose 13
# mutants ARE killed by unit tests added for exactly that purpose. Excluding
# the file would throw those away, and would let any future pure function
# here escape unnoticed. The question this project asks is "could a test
# exist", and for these three it could, so it does.
#
# THIS IS A DEBT, not a conclusion. The real fix is to move the conditions
# out of `main.rs` into `run.rs` and `snapshots.rs` where tests reach them —
# `!running.is_empty() && !supervise` is policy, not plumbing. Taken as a
# deliberate pause so a release is not blocked on a refactor, and recorded
# here rather than as a silent file-level skip.
#
# All exclusions merged — TOML permits one key per table.
exclude_re = [
  "replace > with >= in days_between",
  "replace binary_has_entitlement -> bool with true",
  "in commands::start\\b",
  "replace commands::start ->",
  "in commands::suspend\\b",
  "replace commands::suspend ->",
  "in commands::resume\\b",
  "replace commands::resume ->",
  "in commands::stop\\b",
  "replace commands::stop ->",
  "in commands::status\\b",
  "replace commands::status ->",
  "in commands::spawn_supervisor\\b",
  "replace commands::spawn_supervisor ->",
  # `rachna-agent`'s entry point and its stdio adapter.
  #
  # `main` builds a `Connection` over the process's real stdin/stdout and
  # serves until the socket closes — there is no return value a test can
  # observe without a guest on the other end.
  #
  # `Stdio` is three one-line delegations to `std::io::stdin()` and
  # `stdout()`, which `Stdio::new()` hardcodes. A test cannot inject a
  # substitute, so `read`/`write`/`flush` returning `Ok(0)` is
  # indistinguishable from correct behaviour at this level. The PROTOCOL
  # they carry is tested: `transport.rs` has 21 tests over a pipe and
  # `agent.rs` 14, which is where framing and dispatch actually live.
  #
  # The fix, if this is ever worth it, is for `Stdio::new` to take its two
  # halves as parameters — then a pipe can stand in and these four die.
  "rachna-agent.rs.*replace main ->",
  "replace <impl Read for Stdio>",
  "replace <impl Write for Stdio>",
  "in commands::launch_approved\\b",
  "replace commands::launch_approved ->",
  "in commands::launch_or_supervise\\b",
  "replace commands::launch_or_supervise ->",
  "in commands::read_answer\\b",
  "replace commands::read_answer ->",
  "in commands::read_answer_line\\b",
  "replace commands::read_answer_line ->",
]

# Builds the `rachna` binary users download, signed for the platform it runs on.
#
# WHY A SEPARATE WORKFLOW from `guest.yml`: the guest image is architecture-
# independent to BUILD (it is assembled by substitution, so an x86_64 runner
# can make an aarch64 image) while the CLI must be COMPILED on its target —
# and on macOS it must be signed there too, because signing needs `codesign`.
#
# WHY MACOS NEEDS MORE THAN OTHER CLI TOOLS DO, measured against real
# releases rather than assumed — the first version of this comment got it
# wrong twice.
#
#   fzf      Developer ID + notarized   runs when quarantined
#   lsd      ad-hoc signed              runs when quarantined
#   rachna   ad-hoc signed              BLOCKED: "Apple could not verify…"
#
# So ad-hoc signing is NOT the problem — `lsd` ships exactly that and is
# fine. Nor is it `codesign` stripping a "linker-signed" exemption: a fresh
# `cargo build` is already plain adhoc before we touch it.
#
# The difference is what rachna LINKS:
#
#   AppKit  CoreFoundation  Foundation  **Virtualization**
#
# A 6.6 MB ad-hoc binary that links Virtualization.framework and claims
# `com.apple.security.virtualization`, with no Team ID to vouch for it, is
# exactly the shape Gatekeeper's malware check exists to stop. `lsd` lists
# files and links none of that.
#
# Two separate things, which the earlier comment conflated:
#
#   the ENTITLEMENT is required for the VM to exist at all (`02` §4:
#   VZVirtualMachine.init throws without it)
#   GATEKEEPER is about whether a downloaded binary may run, and an ad-hoc
#   signature does not satisfy it for a binary like this one
#
# Notarizing fixes the second and needs an Apple Developer account plus
# secrets. Until then a downloaded `rachna` needs its quarantine attribute
# cleared, and the release notes say so next to the download rather than
# leaving someone to meet a dialog offering to Trash their binary.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'attach the binaries to a draft release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: rachna · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compiled on its own target: a cross-compiled macOS binary could
          # not be signed by the runner that built it, and `rusqlite` is
          # bundled C.
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build
        run: cargo build --release --locked

      # The entitlement, on macOS only. `ci/sign-macos.sh` verifies its own
      # work — it re-reads the signature and fails if the entitlement is
      # absent — because a `codesign` that silently produced an unentitled
      # binary is the exact failure this guards.
      - name: sign (macOS)
        if: runner.os == 'macOS'
        run: ./ci/sign-macos.sh target/release/rachna

      # Asserted AFTER packaging rather than before, because the question is
      # whether what we SHIP is signed. A zip round-trip was measured to
      # preserve the entitlement; this proves it per build rather than
      # trusting that measurement forever.
      - name: package
        run: |
          mkdir -p dist
          cp target/release/rachna dist/
          tar -C dist -czf "rachna-${{ matrix.target }}.tar.gz" rachna
          shasum -a 256 "rachna-${{ matrix.target }}.tar.gz" \
            > "rachna-${{ matrix.target }}.tar.gz.sha256"

      - name: the shipped binary is signed (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf check && mkdir check
          tar -C check -xzf "rachna-${{ matrix.target }}.tar.gz"
          codesign -v check/rachna
          codesign -d --entitlements - check/rachna 2>&1 \
            | grep -q 'com.apple.security.virtualization' || {
              echo "the packaged binary lost its entitlement — it would die" >&2
              echo "on the user's first \`rachna start\`" >&2
              exit 1
            }
          echo "  packaged binary carries the virtualization entitlement"

      # It runs at all. A binary that builds and cannot execute on the
      # runner that built it will not execute for a user either.
      - name: it runs
        run: ./target/release/rachna --version

      - uses: actions/upload-artifact@v4
        with:
          name: rachna-${{ matrix.target }}
          path: |
            rachna-${{ matrix.target }}.tar.gz
            rachna-${{ matrix.target }}.tar.gz.sha256
          retention-days: 14

  release:
    name: attach to a draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rachna-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            rachna-*.tar.gz
            rachna-*.tar.gz.sha256
          body: |
            ## Install

            Download the archive for your machine, then:

            ```sh
            tar -xzf rachna-<target>.tar.gz
            shasum -a 256 -c rachna-<target>.tar.gz.sha256
            ```

            ### macOS: clear the quarantine flag

            ```sh
            xattr -d com.apple.quarantine rachna
            ./rachna --version
            ```

            Without this, macOS shows **"Apple could not verify 'rachna' is
            free of malware"** and offers to move it to the Trash. The
            process is killed before `main` runs.

            Most CLI tools do not need this step — `lsd`, for instance, is
            ad-hoc signed like `rachna` and runs straight from a download.
            `rachna` is treated differently because it links
            `Virtualization.framework` and claims the
            `com.apple.security.virtualization` entitlement, which is
            exactly the shape Gatekeeper's malware check exists to stop when
            there is no Developer ID behind it.

            That entitlement is not optional: without it
            `VZVirtualMachine.init` throws and no VM can be created at all.
            The release job verifies the packaged binary still carries it.

            Notarizing would remove the `xattr` step. It needs an Apple
            Developer account, and is not set up yet.

            ### The guest image

            `rachna` also needs a Linux guest image, published separately by
            the `guest` workflow. Unpack it into
            `~/.rachna/guests/<version>-<arch>/`, or build one locally with
            `bash ci/build-guest.sh`.

# Builds the guest images users download, and attaches them to a release.
#
# WHY THIS EXISTS: a Linux VM needs a Linux OS inside it, and that image has
# to exist on the user's machine before the first VM can start. Building it
# locally costs ~10 minutes and a working Nix install; downloading a signed
# one costs neither. This is the difference between "clone, build, wait" and
# "install, run".
#
# Both architectures, because a guest image is only useful to a host that
# can run it: aarch64 for Apple Silicon and ARM Linux, x86_64 for Intel
# Linux. An aarch64-only pipeline leaves half the hosts that can run a
# guest with nothing to download.
name: guest

on:
  # MAIN AND TAGS, WITH NO `paths` FILTER — deliberately, and the absence is
  # the load-bearing part.
  #
  # GitHub allows one `push:` key, and a `paths:` filter inside it applies
  # to TAG pushes as well: `v1.0` would then build images only if that
  # commit happened to touch `guest/`, which a release tag usually does
  # not, and the release would silently ship no images.
  #
  # And without `branches: [main]` the build never ran outside a tag at
  # all. Measured: a commit rewriting `guest/flake.nix` AND
  # `ci/build-guest.sh` triggered no guest run, because this project pushes
  # straight to main and only `pull_request` carried the path filter. A tag
  # was therefore the first place a broken image build could surface —
  # exactly the case the filter was meant to prevent.
  #
  # So the trade is explicit: every push to main builds the images, doc-only
  # commits included, in exchange for never discovering at tag time that
  # the thing a user boots does not build.
  push:
    branches: [main]
    tags: ['v*']

  # A change to what the image is MADE of rebuilds it on a PR too. Path
  # filters are safe here, because a pull request has no tag to mis-filter:
  # the ext4 bug that wiped the state volume on every boot would be caught
  # before merge, now that the build asserts the filesystem it writes is
  # one the kernel can mount.
  pull_request:
    paths:
      - 'ci/build-guest.sh'
      - 'guest/**'
      - '.github/workflows/guest.yml'

  # Buildable on demand, because a guest image is expensive and nobody
  # should have to push to find out whether it still builds.
  workflow_dispatch:
    inputs:
      publish:
        description: 'attach the images to a draft release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: guest · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image is assembled by SUBSTITUTION — every package is
          # fetched prebuilt and signed from cache.nixos.org, nothing is
          # compiled — so the builder's own architecture does not have to
          # match the guest's. Both run on x86_64 runners, which are the
          # ones the free tier reliably provides.
          - arch: aarch64
            runner: ubuntu-24.04
          - arch: x86_64
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The build needs ~2 GB of free disk for a 615 MB image plus its
      # work tree, and GitHub runners start with the disk fairly full.
      # Measured locally: the build failed three times on a machine with a
      # few hundred MB spare, which is a confusing failure to debug in CI.
      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - name: build the guest image
        run: bash ci/build-guest.sh "$PWD/out" ${{ matrix.arch }}

      # The script verifies the image itself (e2fsck on the installed
      # file, an ELF-architecture check on every binary), so this asserts
      # the ARTEFACTS rather than re-checking the filesystem: a job that
      # uploads an empty file is worse than one that fails.
      - name: check what was produced
        run: |
          cd out
          for f in Image initramfs.gz root.img; do
            test -s "$f" || { echo "$f is missing or empty" >&2; exit 1; }
          done
          ls -la
          sha256sum Image initramfs.gz root.img | tee SHA256SUMS

      # THE VERSION IS IN THE FILENAME, because the guest image and the
      # binary are versioned together and the binary looks in a
      # version-named directory (`08` §4.1.1).
      #
      # Without it: `v0.2.0` ships a new guest, the tarball is still called
      # `rachna-guest-aarch64.tar.gz`, and a user on `v0.1.0` who re-runs
      # the installer silently gets the NEWER image — which their binary
      # never looks for, so `rachna start` reports "no guest image" on a
      # machine that just downloaded one.
      #
      # Read from the build script so there is one source of truth; a test
      # asserts the three copies agree.
      - name: package
        run: |
          version=$(grep -oE '^GUEST_VERSION="\$\{GUEST_VERSION:-[^}]+\}"' \
            ci/build-guest.sh | sed -E 's/.*:-([^}]+)\}.*/\1/')
          test -n "$version" || { echo "could not read GUEST_VERSION" >&2; exit 1; }
          name="rachna-guest-$version-${{ matrix.arch }}.tar.gz"
          tar -C out -czf "$name" Image initramfs.gz root.img SHA256SUMS
          ls -la "$name"
          echo "GUEST_ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rachna-guest-${{ matrix.arch }}
          path: ${{ env.GUEST_ARCHIVE }}
          retention-days: 14

  # THE REAL GUEST, which cannot be built on a Mac and can be built here.
  #
  # `guest/guest.nix` is the NixOS system Rachna is designed around —
  # systemd, declared services, devenv in the image. Building it wants 240
  # derivations for aarch64-linux, which an aarch64-darwin host refuses by
  # platform policy (nix will not run a Linux derivation on Darwin even when
  # the work is writing a text file). That is why `ci/build-guest.sh` exists
  # and assembles a stand-in by substitution instead.
  #
  # A NATIVE ARM LINUX RUNNER has no such problem, and GitHub now provides
  # one. So the blocker was only ever local — stated as a platform limit for
  # most of this project's life, and never actually tried in CI.
  #
  # It builds `vz-image`, NOT `boot-bundle`. Both exist and they are
  # different shapes on purpose: `boot-bundle` is for Cloud Hypervisor,
  # which needs a PVH-capable ELF extracted from the bzImage nixpkgs ships
  # (`05` §4.4), while Apple's `VZLinuxBootLoader` takes the kernel AS
  # SHIPPED. `vz-image` also names its files `Image`/`initramfs.gz`/
  # `root.img`, which is a CONTRACT with `boot.rs`'s `Image::find` — it
  # looks for exactly those three in one version-named directory. The old
  # version of this job built `boot-bundle` and would have produced an
  # image `rachna start` reports as "incomplete" even on success.
  #
  # It also UPLOADS what it built. The old version ran `nix build` twice
  # and threw the result away, so a green run shipped nothing — proving the
  # build works is not the same as producing an image a user can download.
  real-guest:
    name: the real NixOS guest · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NATIVE RUNNERS, unlike the stand-in's matrix above. The
          # stand-in is pure substitution so any host can assemble it;
          # this one BUILDS ~240 derivations for the guest's architecture,
          # and nix refuses a foreign-platform derivation even when the
          # work is writing a text file. So each arch builds on its own.
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # More aggressive than the stand-in's: that one fetches a 615 MB
      # image, this one builds a system whose closure measured 758 MB of
      # downloads for 2.3 GiB unpacked, plus a squashfs of the result and
      # the work tree to make it.
      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache || true
          df -h / | tail -1

      # ONE build, its path captured. `--print-out-paths` with `--no-link`
      # gives the store path without writing a `result` symlink into the
      # checkout.
      - name: build the real guest
        run: |
          out=$(nix build --no-link --print-out-paths \
            "./guest#packages.${{ matrix.arch }}-linux.vz-image")
          test -n "$out" || { echo "nix build printed no path" >&2; exit 1; }
          echo "GUEST_OUT=$out" >> "$GITHUB_ENV"
          ls -la "$out"

      # The derivation already asserts non-empty files and the kernel
      # magic, so this checks the ARTEFACT SHAPE: the three names
      # `Image::find` requires, present and non-empty in one directory.
      # A job that uploads an incomplete image is worse than one that
      # fails.
      - name: check what was produced
        run: |
          for f in Image initramfs.gz root.img; do
            test -s "$GUEST_OUT/$f" \
              || { echo "$f is missing or empty" >&2; exit 1; }
          done
          file -b "$GUEST_OUT/Image"
          du -h "$GUEST_OUT"/* | sort -h

      # Named `rachna-real-guest-…` so it cannot be confused with the
      # stand-in's archive, which carries the same version and arch. Both
      # are published while the real one is being proven on real hardware;
      # the stand-in goes away once it is.
      - name: package
        run: |
          version=$(grep -oE '^GUEST_VERSION="\$\{GUEST_VERSION:-[^}]+\}"' \
            ci/build-guest.sh | sed -E 's/.*:-([^}]+)\}.*/\1/')
          test -n "$version" || { echo "could not read GUEST_VERSION" >&2; exit 1; }
          name="rachna-real-guest-$version-${{ matrix.arch }}.tar.gz"
          # Dereferenced: the store output holds a `system` SYMLINK into
          # /nix/store, and a tar of that link is useless on a machine
          # with no such store. `-h` also makes the archive self-contained
          # rather than silently arch-specific.
          install -d pack
          cp -L "$GUEST_OUT"/Image "$GUEST_OUT"/initramfs.gz \
            "$GUEST_OUT"/root.img "$GUEST_OUT"/cmdline pack/
          ( cd pack && sha256sum Image initramfs.gz root.img cmdline \
              > SHA256SUMS && cat SHA256SUMS )
          tar -C pack -czf "$name" \
            Image initramfs.gz root.img cmdline SHA256SUMS
          ls -la "$name"
          echo "REAL_ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rachna-real-guest-${{ matrix.arch }}
          path: ${{ env.REAL_ARCHIVE }}
          retention-days: 14

  release:
    name: attach to a draft release
    # BOTH builds, so a release carries the real guest as well as the
    # stand-in. With `needs: build` alone a tag could publish while the
    # real-guest job was still running, and the release would be missing
    # exactly the image it is meant to start shipping.
    needs: [build, real-guest]
    # A tag or an explicit request only. A push to `main` that touches the
    # guest should BUILD the image — that is the regression check — without
    # creating a release for it.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Both patterns. `rachna-guest-*` would not match
      # `rachna-real-guest-*`, so the real images would be built, uploaded
      # as workflow artefacts, and then silently left out of the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: rachna-*guest-*
          merge-multiple: true

      # DRAFT, deliberately. A guest image is the thing a user's
      # environment boots from, so publishing one should be a decision
      # somebody makes rather than a side effect of pushing a tag.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            rachna-guest-*.tar.gz
            rachna-real-guest-*.tar.gz
          body: |
            Guest images for Rachna.

            The filename carries the guest version, and so does the
            directory it belongs in — unpack
            `rachna-guest-<version>-<arch>.tar.gz` into
            `~/.rachna/guests/<version>-<arch>/` and `rachna start` finds
            it. They must match: the binary looks in one version-named
            directory and nowhere else.

            `curl -fsSL .../ci/install.sh | sh` does this for you.

            Verify with the included `SHA256SUMS` before unpacking.

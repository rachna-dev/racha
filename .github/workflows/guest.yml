# Builds the guest images users download, and attaches them to a release.
#
# WHY THIS EXISTS: a Linux VM needs a Linux OS inside it, and that image has
# to exist on the user's machine before the first VM can start. Building it
# locally costs ~10 minutes and a working Nix install; downloading a signed
# one costs neither. This is the difference between "clone, build, wait" and
# "install, run".
#
# Both architectures, because a guest image is only useful to a host that
# can run it: aarch64 for Apple Silicon and ARM Linux, x86_64 for Intel
# Linux. An aarch64-only pipeline leaves half the hosts that can run a
# guest with nothing to download.
name: guest

on:
  # A TAG BUILDS UNCONDITIONALLY, in its own trigger. Putting `tags` and
  # `paths` under one `push` applies the path filter to tags too, so `v1.0`
  # would build images only if that commit happened to touch `guest/` —
  # which a release tag usually does not. Releases would have silently
  # shipped no images.
  push:
    tags: ['v*']

  # And a change to what the image is MADE of rebuilds it. A tag is a bad
  # place to discover the image build is broken, and so is a user's first
  # `rachna start`: the ext4 bug that wiped the state volume on every boot
  # would be caught here, now that the build asserts the filesystem it
  # writes is one the kernel can mount.
  pull_request:
    paths:
      - 'ci/build-guest.sh'
      - 'guest/**'
      - '.github/workflows/guest.yml'

  # Buildable on demand, because a guest image is expensive and nobody
  # should have to push to find out whether it still builds.
  workflow_dispatch:
    inputs:
      publish:
        description: 'attach the images to a draft release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: guest · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image is assembled by SUBSTITUTION — every package is
          # fetched prebuilt and signed from cache.nixos.org, nothing is
          # compiled — so the builder's own architecture does not have to
          # match the guest's. Both run on x86_64 runners, which are the
          # ones the free tier reliably provides.
          - arch: aarch64
            runner: ubuntu-24.04
          - arch: x86_64
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The build needs ~2 GB of free disk for a 615 MB image plus its
      # work tree, and GitHub runners start with the disk fairly full.
      # Measured locally: the build failed three times on a machine with a
      # few hundred MB spare, which is a confusing failure to debug in CI.
      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - name: build the guest image
        run: bash ci/build-guest.sh "$PWD/out" ${{ matrix.arch }}

      # The script verifies the image itself (e2fsck on the installed
      # file, an ELF-architecture check on every binary), so this asserts
      # the ARTEFACTS rather than re-checking the filesystem: a job that
      # uploads an empty file is worse than one that fails.
      - name: check what was produced
        run: |
          cd out
          for f in Image initramfs.gz root.img; do
            test -s "$f" || { echo "$f is missing or empty" >&2; exit 1; }
          done
          ls -la
          sha256sum Image initramfs.gz root.img | tee SHA256SUMS

      # THE VERSION IS IN THE FILENAME, because the guest image and the
      # binary are versioned together and the binary looks in a
      # version-named directory (`08` §4.1.1).
      #
      # Without it: `v0.2.0` ships a new guest, the tarball is still called
      # `rachna-guest-aarch64.tar.gz`, and a user on `v0.1.0` who re-runs
      # the installer silently gets the NEWER image — which their binary
      # never looks for, so `rachna start` reports "no guest image" on a
      # machine that just downloaded one.
      #
      # Read from the build script so there is one source of truth; a test
      # asserts the three copies agree.
      - name: package
        run: |
          version=$(grep -oE '^GUEST_VERSION="\$\{GUEST_VERSION:-[^}]+\}"' \
            ci/build-guest.sh | sed -E 's/.*:-([^}]+)\}.*/\1/')
          test -n "$version" || { echo "could not read GUEST_VERSION" >&2; exit 1; }
          name="rachna-guest-$version-${{ matrix.arch }}.tar.gz"
          tar -C out -czf "$name" Image initramfs.gz root.img SHA256SUMS
          ls -la "$name"
          echo "GUEST_ARCHIVE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: rachna-guest-${{ matrix.arch }}
          path: ${{ env.GUEST_ARCHIVE }}
          retention-days: 14

  # THE REAL GUEST, which cannot be built on a Mac and can be built here.
  #
  # `guest/guest.nix` is the NixOS system Rachna is designed around —
  # systemd, declared services, devenv in the image. Building it wants 240
  # derivations for aarch64-linux, which an aarch64-darwin host refuses by
  # platform policy (nix will not run a Linux derivation on Darwin even when
  # the work is writing a text file). That is why `ci/build-guest.sh` exists
  # and assembles a stand-in by substitution instead.
  #
  # A NATIVE ARM LINUX RUNNER has no such problem, and GitHub now provides
  # one. So the blocker was only ever local — stated as a platform limit for
  # most of this project's life, and never actually tried in CI.
  #
  # `continue-on-error` while it is being proven: the stand-in is what ships
  # today, and a red job on an unproven path would stop the pipeline that
  # publishes a working image. Remove it once this is green.
  real-guest:
    name: the real NixOS guest (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: build guest#boot-bundle
        run: |
          nix build --no-link --print-out-paths \
            ./guest#packages.aarch64-linux.boot-bundle

      # What it produced, because "the build succeeded" and "there is a
      # bootable kernel and root" are different claims.
      - name: what it produced
        run: |
          out=$(nix build --no-link --print-out-paths \
            ./guest#packages.aarch64-linux.boot-bundle)
          ls -la "$out"

  release:
    name: attach to a draft release
    needs: build
    # A tag or an explicit request only. A push to `main` that touches the
    # guest should BUILD the image — that is the regression check — without
    # creating a release for it.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rachna-guest-*
          merge-multiple: true

      # DRAFT, deliberately. A guest image is the thing a user's
      # environment boots from, so publishing one should be a decision
      # somebody makes rather than a side effect of pushing a tag.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: rachna-guest-*.tar.gz
          body: |
            Guest images for Rachna.

            The filename carries the guest version, and so does the
            directory it belongs in — unpack
            `rachna-guest-<version>-<arch>.tar.gz` into
            `~/.rachna/guests/<version>-<arch>/` and `rachna start` finds
            it. They must match: the binary looks in one version-named
            directory and nowhere else.

            `curl -fsSL .../ci/install.sh | sh` does this for you.

            Verify with the included `SHA256SUMS` before unpacking.

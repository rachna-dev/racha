# CI mirrors the gate in AGENTS.md, plus the mutation bar that gates it.
#
# The important job is `mutants`: for a security boundary, "does the suite FAIL
# when behaviour changes" is the honest measure. 100% line coverage with
# assertion-free tests proves nothing, so a surviving mutant fails the build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: fmt
        run: devenv shell -- cargo fmt --all --check
      - name: clippy
        run: devenv shell -- cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: devenv shell -- cargo nextest run --workspace

  mutants:
    name: mutation testing (a surviving mutant fails the build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      # cargo-mutants exits non-zero when a mutant survives, which is exactly
      # the gate we want: a surviving mutant in policy or path code is a bug in
      # the test suite, not an acceptable gap.
      - name: mutants
        run: devenv shell -- cargo mutants --colors=never --in-place
      - name: upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: ignore

  coverage:
    name: coverage (reported, not gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Coverage is a floor, not the bar — see AGENTS.md. Reported so a drop is
      # visible, never gated, so nobody games the number.
      #
      # Installed via rustup rather than the devenv shell: cargo-llvm-cov fails
      # its own test suite in the pinned nixpkgs on both platforms, so it is
      # deliberately absent from the shell.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: coverage
        run: cargo llvm-cov nextest --summary-only

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv shell -- cargo machete
      - run: devenv shell -- cargo deny check
